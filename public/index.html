<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Sistemas</title>
  <meta name="theme-color" content="#1D1A39" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='13' height='13' rx='4' fill='%23E2127A'/%3E%3Crect x='17' y='2' width='13' height='13' rx='4' fill='%232F4BEB'/%3E%3Crect x='2' y='17' width='13' height='13' rx='4' fill='%23FFB31F'/%3E%3Crect x='17' y='17' width='13' height='13' rx='4' fill='%2300A383'/%3E%3C/svg%3E" />
  <link rel="preload" href="fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/tailwind.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

  <!-- Barra Superior Minimalista -->
  <header id="barraSuperior" class="sticky top-0 z-30 barra-superior">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <a href="#" class="flex items-center gap-3 shrink-0 rounded-lg" aria-label="Mis Sistemas, inicio">
        <span class="marca" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="font-display text-lg font-extrabold tracking-tight text-white">Mis Sistemas</span>
      </a>

      <div class="flex items-center gap-2.5">
        <span id="serverModeBadge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          Conectado
        </span>

        <div class="relative" id="dropdownConfigWrapper">
          <button id="btnConfigMenu" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="configDropdown"
            class="boton-barra h-9 inline-flex items-center gap-1.5 px-3.5 rounded-xl text-xs font-semibold transition">
            Opciones
            <span class="text-[10px] opacity-60" aria-hidden="true">▾</span>
          </button>

          <div id="configDropdown"
            class="hidden absolute right-0 mt-2 w-72 max-w-[calc(100vw-2rem)] rounded-2xl bg-white border border-slate-200 shadow-xl py-2 z-50 text-xs">
            <button id="btnToggleAutoLogin" type="button" class="w-full px-3.5 py-2 text-left text-slate-700 hover:bg-slate-50 flex items-center justify-between gap-3">
              <span>Iniciar sesión automáticamente</span>
              <span id="labelAutoLogin" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700">ON</span>
            </button>
            <button id="btnToggleAutoStart" type="button" class="w-full px-3.5 py-2 text-left text-slate-700 hover:bg-slate-50 flex items-center justify-between gap-3">
              <span>Encender el sistema al entrar</span>
              <span id="labelAutoStart" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700">ON</span>
            </button>
            <button id="btnToggleAllPasswords" type="button" class="w-full px-3.5 py-2 text-left text-slate-700 hover:bg-slate-50 flex items-center justify-between gap-3">
              <span>Mostrar todas las contraseñas</span>
              <span id="labelTogglePasswords" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-200 text-slate-600">OFF</span>
            </button>

            <div class="my-1.5 border-t border-slate-100"></div>
            <button id="btnScanBats" type="button" data-cierra-menu class="w-full px-3.5 py-2 text-left text-slate-700 hover:bg-slate-50 flex items-center justify-between gap-3">Escanear carpetas y .bat</button>
            <button id="btnCheckStatus" type="button" data-cierra-menu class="w-full px-3.5 py-2 text-left text-slate-700 hover:bg-slate-50 flex items-center justify-between gap-3">Actualizar estado</button>
            <button id="btnAuditAll" type="button" data-cierra-menu class="w-full px-3.5 py-2 text-left text-slate-700 hover:bg-slate-50 flex items-center justify-between gap-3">Auditoría de todos (OWASP)</button>

            <div class="my-1.5 border-t border-slate-100"></div>
            <button id="btnExportJSON" type="button" data-cierra-menu class="w-full px-3.5 py-2 text-left text-slate-700 hover:bg-slate-50 flex items-center justify-between gap-3">Exportar catálogo (.json)</button>
            <label for="inputImportJSON" data-cierra-menu class="w-full px-3.5 py-2 text-left text-slate-700 hover:bg-slate-50 flex items-center justify-between gap-3 cursor-pointer">
              Importar catálogo (.json)
              <input id="inputImportJSON" type="file" accept=".json" class="hidden" />
            </label>
            <button id="btnResetDefaults" type="button" data-cierra-menu class="w-full px-3.5 py-2 text-left text-slate-700 hover:bg-slate-50 flex items-center justify-between gap-3">Restaurar un respaldo…</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ===================================================================== -->
  <!-- VISTA 1 (PRINCIPAL): PANEL DE INICIO SENCILLO (UN ICONO POR SISTEMA)  -->
  <!-- ===================================================================== -->
  <main id="launcherViewSection" class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-7 sm:pt-9 pb-14">
    <div class="portada">
      <h2 class="portada-titulo font-display">¿Qué abrimos hoy?</h2>
    </div>

    <div id="launcherIconsGrid" class="estampas">
      <!-- Estampas de los sistemas generadas dinámicamente -->
    </div>
  </main>

  <!-- Panel de cada sistema (se abre al tocar su estampa) -->
  <section id="vistaSistema" class="hidden flex-1" aria-labelledby="tituloSistema"></section>

  <div id="projectModal" data-modal role="dialog" aria-modal="true" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-2xl max-w-4xl w-full max-h-[92vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <h2 id="modalTitle" class="text-base font-bold text-slate-900">Configurar Sistema y Roles</h2>
        <button id="btnCloseModal" type="button" class="px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-800 hover:bg-slate-200/60">
          Cerrar
        </button>
      </div>

      <form id="projectForm" class="flex-1 overflow-y-auto p-6 space-y-6">
        <input type="hidden" id="formProjectId" />

        <div class="space-y-4">
          <h3 class="text-xs font-bold uppercase tracking-wider text-indigo-600">1. Datos del Sistema</h3>

          <div class="grid grid-cols-1 sm:grid-cols-12 gap-4">
            <div class="sm:col-span-6">
              <label class="block text-xs font-medium text-slate-700 mb-1">Nombre del Proyecto *</label>
              <input id="formNombre" type="text" required placeholder="Ej. Sistema de Titulación CUCSur"
                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 focus:outline-none focus:border-indigo-500" />
            </div>

            <div class="sm:col-span-3">
              <label class="block text-xs font-medium text-slate-700 mb-1">Categoría</label>
              <input id="formCategoria" type="text" list="categoriasSugeridas" placeholder="Académico"
                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 focus:outline-none focus:border-indigo-500" />
              <datalist id="categoriasSugeridas">
                <option value="Académico"></option>
                <option value="Comercial / POS"></option>
                <option value="Administrativo"></option>
                <option value="Servicios"></option>
              </datalist>
            </div>

            <div class="sm:col-span-3">
              <label class="block text-xs font-medium text-slate-700 mb-1">Color de Tema</label>
              <select id="formColor"
                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 focus:outline-none focus:border-indigo-500">
                <option value="indigo">Índigo</option>
                <option value="emerald">Esmeralda</option>
                <option value="orange">Naranja</option>
                <option value="cyan">Cian</option>
                <option value="amber">Ámbar</option>
                <option value="rose">Rosa</option>
                <option value="violet">Violeta</option>
                <option value="blue">Azul</option>
              </select>
            </div>

            <div class="sm:col-span-12">
              <label class="block text-xs font-medium text-slate-700 mb-1">Descripción breve</label>
              <input id="formSubtitulo" type="text" placeholder="Descripción corta del propósito del sistema"
                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 focus:outline-none focus:border-indigo-500" />
            </div>

            <div class="sm:col-span-5">
              <label class="block text-xs font-medium text-slate-700 mb-1">URL Base *</label>
              <input id="formUrlBase" type="url" required placeholder="http://localhost:8000"
                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 font-cred focus:outline-none focus:border-indigo-500" />
            </div>

            <div class="sm:col-span-2">
              <label class="block text-xs font-medium text-slate-700 mb-1">Puerto</label>
              <input id="formPuerto" type="number" placeholder="8000"
                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 font-cred focus:outline-none focus:border-indigo-500" />
            </div>

            <div class="sm:col-span-5">
              <label class="block text-xs font-medium text-slate-700 mb-1">Tecnologías (separadas por coma)</label>
              <input id="formStack" type="text" placeholder="Laravel 12, PHP, MySQL"
                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 focus:outline-none focus:border-indigo-500" />
            </div>

            <div class="sm:col-span-6">
              <label class="block text-xs font-medium text-slate-700 mb-1">Carpeta Local</label>
              <input id="formCarpetaLocal" type="text" placeholder="..\Sis-Titulacion\titulacion-cucsur"
                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 font-cred focus:outline-none focus:border-indigo-500" />
            </div>

            <div class="sm:col-span-4">
              <label class="block text-xs font-medium text-slate-700 mb-1">Archivo .bat o Comando de Inicio</label>
              <input id="formComandoInicio" type="text" placeholder="iniciar-sistema.bat"
                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 font-cred focus:outline-none focus:border-indigo-500" />
            </div>

            <div class="sm:col-span-2 flex items-end pb-2">
              <label class="inline-flex items-center gap-2 cursor-pointer select-none">
                <input id="formFavorito" type="checkbox" class="w-4 h-4 rounded accent-indigo-600" />
                <span class="text-xs font-medium text-slate-700">Destacado</span>
              </label>
            </div>

            <div class="sm:col-span-12">
              <label class="block text-xs font-medium text-slate-700 mb-1">Notas del sistema</label>
              <input id="formNotasSistema" type="text" placeholder="Notas opcionales sobre datos de prueba"
                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 focus:outline-none focus:border-indigo-500" />
            </div>
          </div>
        </div>

        <div class="space-y-3 pt-4 border-t border-slate-200">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-700">2. Usuarios / Roles (Opcional)</h3>
            </div>
            <button id="btnAddRoleRow" type="button"
              class="inline-flex items-center px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 transition">
              + Agregar Usuario
            </button>
          </div>

          <div id="rolesFormContainer" class="space-y-3"></div>
        </div>
      </form>

      <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-3">
        <button id="btnDeleteProject" type="button"
          class="hidden inline-flex items-center px-3.5 py-2 rounded-xl text-xs font-semibold bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 transition">
          Eliminar Sistema
        </button>
        <div class="flex items-center gap-2.5 ml-auto">
          <button id="btnCancelModal" type="button"
            class="px-4 py-2 rounded-xl text-xs font-semibold bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 transition">
            Cancelar
          </button>
          <button id="btnSaveProject" type="button"
            class="inline-flex items-center px-5 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition">
            Guardar Cambios
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: Reporte de Auditoría OWASP -->
  <div id="auditModal" data-modal role="dialog" aria-modal="true" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <div>
          <h2 id="auditModalTitle" class="text-base font-bold text-slate-900">Auditoría de Seguridad (OWASP)</h2>
        </div>
        <button id="btnCloseAuditModal" type="button" class="px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-800 hover:bg-slate-200/60">
          Cerrar
        </button>
      </div>

      <div id="auditModalContent" class="flex-1 overflow-y-auto p-6 space-y-5 bg-slate-50/50"></div>

      <div class="px-6 py-3.5 bg-white border-t border-slate-200 flex flex-wrap items-center justify-between gap-3">
        <span></span>
        <div class="flex items-center gap-2">
          <button id="btnExportAuditReport" type="button"
            class="inline-flex items-center px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
            Descargar Informe (.json)
          </button>
          <button id="btnDoneAuditModal" type="button"
            class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white transition">
            Cerrar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: Simulador de Usuarios Concurrentes y Punto de Quiebre -->
  <div id="loadTestModal" data-modal role="dialog" aria-modal="true" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <div>
          <h2 id="loadTestModalTitle" class="text-base font-bold text-slate-900">Simulador de Usuarios Concurrentes</h2>
        </div>
        <button id="btnCloseLoadTestModal" type="button" class="px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-800 hover:bg-slate-200/60">
          Cerrar
        </button>
      </div>

      <div class="px-6 py-3.5 bg-white border-b border-slate-100 flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-3">
          <div>
            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-0.5">Modo de Prueba</label>
            <select id="selectLoadMode" class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-800 focus:outline-none focus:border-indigo-500">
              <option value="escalera">Escalera progresiva (Detectar punto de quiebre)</option>
              <option value="fijo">Carga fija de usuarios al mismo tiempo</option>
            </select>
          </div>

          <div>
            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-0.5">Límite de Usuarios Simultáneos</label>
            <select id="selectMaxUsers" class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-800 focus:outline-none focus:border-indigo-500">
              <option value="50">Hasta 50 usuarios</option>
              <option value="100">Hasta 100 usuarios</option>
              <option value="200" selected>Hasta 200 usuarios</option>
              <option value="300">Hasta 300 usuarios (Aula completa)</option>
              <option value="400">Hasta 400 usuarios (Estrés máximo)</option>
            </select>
          </div>
        </div>

        <button id="btnStartLoadTest" type="button"
          class="inline-flex items-center px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition">
          Iniciar Simulación
        </button>
      </div>

      <div id="loadTestModalContent" class="flex-1 overflow-y-auto p-6 space-y-5 bg-slate-50/50"></div>

      <div class="px-6 py-3.5 bg-white border-t border-slate-200 flex flex-wrap items-center justify-between gap-3">
        <span></span>
        <button id="btnDoneLoadTestModal" type="button"
          class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
          Cerrar
        </button>
      </div>
    </div>
  </div>

  <!-- Notificaciones Toast -->

  <!-- MODAL: Respaldos del catálogo -->
  <div id="backupsModal" data-modal role="dialog" aria-modal="true" aria-labelledby="backupsModalTitle" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-2xl max-w-xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <div>
          <h2 id="backupsModalTitle" class="text-base font-bold text-slate-900">Restaurar un respaldo</h2>
        </div>
        <button id="btnCloseBackupsModal" type="button" aria-label="Cerrar" class="px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-800 hover:bg-slate-200/60">
          Cerrar
        </button>
      </div>
      <div id="backupsModalContent" aria-live="polite" class="flex-1 overflow-y-auto p-5 bg-slate-50/50"></div>
      <div class="px-6 py-3.5 bg-white border-t border-slate-200 flex justify-end">
        <button id="btnDoneBackupsModal" type="button"
          class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
          Cerrar
        </button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <script src="js/default-data.js?v=8"></script>
  <script src="js/utils.js?v=8"></script>
  <script src="js/render.js?v=8"></script>
  <script src="js/modals.js?v=8"></script>
  <script src="js/app.js?v=8"></script>
</body>
</html>
